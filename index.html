<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>C to Scratch Converter</title>
<style>
body { font-family: monospace; padding: 2em; background: #f0f0f0; }
textarea { width: 100%; height: 150px; }
button { padding: 0.5em 1em; margin-top: 1em; }
pre { background: #fff; padding: 1em; border: 1px solid #ccc; overflow-x: auto; }
</style>
</head>
<body>

<h1>C to Scratch Converter</h1>
<textarea id="cInput" placeholder="Paste C code here..."></textarea>
<br>
<button onclick="convertCtoSB3()">Convert</button>

<h2>SB3-like Output (JSON)</h2>
<pre id="output"></pre>

<script>
function convertCtoSB3() {
    const cCode = document.getElementById('cInput').value;
    
    // Simple parser for putstring("...")
    const putStringMatch = cCode.match(/putstring\("([^"]*)"\)/);
    const text = putStringMatch ? putStringMatch[1] : "";

    const blocks = [];
    
    // Green flag block
    blocks.push({
        opcode: "event_whenflagclicked",
        inputs: {},
        fields: {},
        next: "main_block",
        topLevel: true
    });

    // Define call block
    blocks.push({
        opcode: "procedures_define",
        inputs: {
            name: { type: "string", value: "call" }
        },
        fields: {},
        next: "main_block",
        topLevel: false
    });

    // Define main block
    const mainBlock = {
        opcode: "procedures_define",
        inputs: {
            name: { type: "string", value: "main" }
        },
        fields: {},
        next: null,
        topLevel: false,
        extra: []
    };

    // Turn the string into repeated putchar calls
    for (let char of text) {
        mainBlock.extra.push({
            opcode: "custom_call_stdcout_putchar",
            inputs: { char: char }
        });
    }

    blocks.push(mainBlock);

    document.getElementById('output').textContent = JSON.stringify(blocks, null, 2);
}
</script>

</body>
</html>
